name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "backend[dev]"

      - name: Lint
        run: ruff check backend/app backend/tests

      - name: Test
        working-directory: backend
        run: python -m pytest -q

      - name: End-to-end controlled workflow
        run: python scripts/walkthrough.py

      - name: Export the OpenAPI contract
        working-directory: backend
        run: |
          python - <<'PY'
          import json, pathlib
          from app.main import create_app
          schema = create_app().openapi()
          pathlib.Path("../docs/openapi.json").write_text(json.dumps(schema, indent=2))
          print(f"{len(schema['paths'])} documented routes")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/openapi.json

  frontend:
    name: Web application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci || npm install

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build

  containers:
    name: Container build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: mip-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: mip-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
