name: Web application to GitHub Pages

# Publishes the React workspaces as a static site at
# https://rameshs-rama.github.io/cnc/ on every change to the frontend on main.
#
# The site is only a UI. It talks to whichever API it is pointed at: the build
# inlines API_BASE (a repository variable, Settings > Secrets and variables >
# Actions > Variables) and falls back to the URL the Render blueprint produces.
# Either way the sign-in page can change the endpoint at runtime, and a link
# can carry it as ?api=https://… so nothing here has to be rebuilt to try a
# different API.

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the static site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Creates the Pages site on first run and reports the base path
      # (/cnc for a project site), which becomes Vite's build base.
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          VITE_API_BASE: ${{ vars.API_BASE || 'https://cnc-platform-api.onrender.com' }}
        run: |
          npx tsc -b
          npx vite build --base "${{ steps.pages.outputs.base_path }}/"
          # Pages serves 404.html for unknown paths; a copy of the app lets the
          # router take over deep links such as /projects/<id>.
          cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
