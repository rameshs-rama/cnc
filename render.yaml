# Render blueprint: a temporary, shareable deployment for evaluating the platform.
#
# What you get
#   cnc-platform-api  the FastAPI service, with the interactive contract at /docs
#   cnc-platform-web  the React workspaces as a static site (optional)
#
# The API is self-contained and needs nothing filled in: both signing secrets are
# generated by Render, and the pilot factory plus the benchmark part are seeded on
# first boot. Deploy it alone and you have a working URL.
#
# This is an EVALUATION profile, not a production one. On Render's free instance
# type there is no persistent disk, so the SQLite database and the object store
# live on ephemeral storage and reset whenever the service restarts or wakes from
# idle. Released packages and audit history do not survive that, which is exactly
# what docs/DEPLOYMENT.md says a production deployment must not do. For anything
# real, switch to the Postgres block at the end of this file, move the object
# store onto a disk, and set MIP_SEED_DEMO to false.

services:
  - type: web
    name: cnc-platform-api
    runtime: docker
    repo: https://github.com/rameshs-rama/cnc
    branch: main
    plan: free
    region: frankfurt
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # Render generates these, so no secret is ever typed into a phone or
      # committed. A leaked release signing key forges release signatures, so it
      # must never fall back to the development default in app/config.py.
      - key: MIP_JWT_SECRET
        generateValue: true
      - key: MIP_RELEASE_SIGNING_SECRET
        generateValue: true

      # Ephemeral storage. /tmp is writable by the unprivileged image user.
      - key: MIP_DATABASE_URL
        value: sqlite:////tmp/mip.db
      - key: MIP_OBJECT_STORE
        value: /tmp/object-store

      # Seeds the demo tenant, pilot factory and benchmark bracket so the URL is
      # worth opening. Set to false before any real tenant touches it.
      - key: MIP_SEED_DEMO
        value: "true"

      # One worker: the free instance is single core, and reconstruction, CAM
      # and simulation are CPU bound.
      - key: MIP_WORKER_THREADS
        value: "1"

      # Only needed if you also deploy the static site below. Paste that site's
      # URL here once it exists, with no trailing slash, then redeploy the API.
      - key: MIP_CORS_ORIGINS
        sync: false

  # Optional. The API alone is enough to evaluate the platform through /docs;
  # deploy this too if you want the 3D workspaces.
  - type: web
    name: cnc-platform-web
    runtime: static
    repo: https://github.com/rameshs-rama/cnc
    branch: main
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: commit
    envVars:
      # Vite reads this at BUILD time, so it must be set before the build runs.
      # Deploy the API first, then paste its URL here, for example
      # https://cnc-platform-api.onrender.com  (no trailing slash).
      - key: VITE_API_BASE
        sync: false
    routes:
      # Single-page app: unknown paths fall through to the React router.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin

# ---------------------------------------------------------------------------
# For a deployment that keeps its data, replace the two SQLite env vars above
# with a managed Postgres and attach a disk to the API service:
#
# databases:
#   - name: cnc-platform-db
#     plan: basic-256mb
#     databaseName: mip
#     user: mip
#
# then on cnc-platform-api:
#   envVars:
#     - key: MIP_DATABASE_URL
#       fromDatabase:
#         name: cnc-platform-db
#         property: connectionString
#   disk:
#     name: object-store
#     mountPath: /data
#     sizeGB: 10
#   envVars:
#     - key: MIP_OBJECT_STORE
#       value: /data/object-store
#
# A disk and a managed database both require a paid instance type. The database
# URL Render supplies begins with postgresql://; the backend's postgres extra is
# already installed in the image, and SQLAlchemy accepts that scheme directly.
# ---------------------------------------------------------------------------
